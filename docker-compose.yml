services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: UTC
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TZ: UTC
      DB_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "${APP_PORT:-8080}:${APP_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # aura-saku-web is a sibling repo (../aura-saku-web relative to this file),
  # never nested inside this one — see its own README for local (non-Docker)
  # dev instructions. BACKEND_BASE_URL here intentionally overrides its
  # .env.local's http://localhost:8081 (used for the "npm run dev outside
  # Docker, backend running via docker-compose" workflow) with the internal
  # Docker network address, since a container reaches another service by
  # service name, not localhost.
  web:
    build:
      context: ../aura-saku-web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_BASE_URL: http://backend:${APP_PORT:-8080}
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
